# src/main/resources/application.yml


spring:
  kafka:
    # Kafka-бутстрап берём из переменной окружения, по умолчанию ПУСТО
    # (в режиме без Kafka это ок, если слушатели вырублены по флагу)
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      group-id: notify-service
      enable-auto-commit: false
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "org.example.events,java.util,java.lang"

#в последующем переведу на
#    token: ${TELEGRAM_BOT_TOKEN}
#    username: ${TELEGRAM_BOT_USERNAME}
# пока он и так светится в комментариях
telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  alert-chat-id: ${TELEGRAM_ALERT_CHAT_ID:0}   # chatId «дежурного» чата/админа
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:false}
    # сюда попадает @Value("${telegram.alert-chat-id:0}")

#  Пишешь своему боту /start.
#  В логах TelegramUpdateHandler обычно выводится update.getMessage().getChatId().
#  Это число и нужно прописать в telegram.alert-chat-id.

autopark:
  base-url: ${AUTOPARK_BASE_URL:http://localhost:8080}

# Настройки SMTP (пока заглушка, позже сюда подставим реальные данные SMTP.BZ)
mail:
  host: smtp.example.com
  port: 587
  username: your-login
  password: your-password
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

notify:
  features:
    auth-sessions:
      enabled: ${NOTIFY_FEATURE_AUTH_SESSIONS_ENABLED:false}
    vehicle-events:
      enabled: ${NOTIFY_FEATURE_VEHICLE_EVENTS_ENABLED:false}
    reports:
      enabled: ${NOTIFY_FEATURE_REPORTS_ENABLED:false}
    monitoring-events:
      enabled: ${NOTIFY_FEATURE_MONITORING_EVENTS_ENABLED:false}
    grafana-webhook:
      enabled: ${NOTIFY_FEATURE_GRAFANA_WEBHOOK_ENABLED:true}

  email:
    enabled: false
    to: "alerts@example.com"
    from: "autopark-monitoring@example.com"
    subject-prefix: "[autopark][ALERT]"

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}

management:
  server:
    port: 8083   # отдельный порт под actuator (можешь выбрать любой свободный)
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: notify-service
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      percentiles-histogram:
        http.server.requests: true

server:
  port: 8082
  tomcat:
    mbeanregistry:
      enabled: true

internal:
  api:
    token: ${INTERNAL_API_TOKEN:dev-token}
